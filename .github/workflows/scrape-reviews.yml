name: Scrape Airbnb reviews (deep)

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and extract reviews
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sS -L -A "$UA" -H "Accept-Language: nl,en;q=0.9" -o page.html "https://www.airbnb.com/rooms/27625624"
          echo "Size: $(wc -c < page.html) bytes"
          echo "=== SEARCHING FOR REVIEW-RELATED KEYS ==="
          grep -oP '"[a-zA-Z]*[Rr]eview[a-zA-Z]*":' page.html | sort -u | head -30
          echo "=== SEARCH FOR COMMENT-RELATED KEYS ==="
          grep -oP '"[a-zA-Z]*[Cc]omment[a-zA-Z]*":' page.html | sort -u | head -20
          echo "=== SEARCH DATE KEYS ==="
          grep -oP '"[a-zA-Z]*[Dd]ate[a-zA-Z]*":' page.html | sort -u | head -20
          echo "=== ANY STAR RATINGS ==="
          grep -oP '"[a-zA-Z]*[Ss]tar[a-zA-Z]*":[0-9]' page.html | sort -u | head -20
          echo "=== REVIEWER PATTERN VARIANTS ==="
          grep -oP '"reviewer[A-Za-z]*":"[^"]{2,40}"' page.html | head -10
          grep -oP '"author[^"]*":"[^"]{2,40}"' page.html | head -10
          echo "=== LOOK FOR LOCALIZED DATE ==="
          grep -oP '"localized[A-Za-z]*":"[^"]{3,30}"' page.html | head -20
          echo "=== LOOK FOR PAGINATION / REVIEW COUNT ==="
          grep -oP '"reviewCount":[0-9]+' page.html | head -5
          grep -oP '"totalCount":[0-9]+' page.html | head -5
          echo "=== CHECK IF REVIEWS IN NEXT_DATA ==="
          python3 -c "
import re, json
html = open('page.html').read()
m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', html, re.DOTALL)
if m:
    print('Found __NEXT_DATA__, size:', len(m.group(1)))
    data = json.loads(m.group(1))
    # Print all top-level keys recursively up to depth 3
    def keys_at(obj, depth=0, prefix=''):
        if depth > 3: return
        if isinstance(obj, dict):
            for k, v in obj.items():
                if any(x in k.lower() for x in ['review','comment','guest','rating','star','author']):
                    print(prefix + k + ': ' + repr(v)[:100])
                else:
                    keys_at(v, depth+1, prefix + k + '.')
        elif isinstance(obj, list) and len(obj) > 0:
            keys_at(obj[0], depth+1, prefix + '[0].')
    keys_at(data)
else:
    print('No __NEXT_DATA__ found')
    # Check if there is any JSON in script tags
    scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, re.DOTALL)
    print(f'Found {len(scripts)} script tags')
    for i, s in enumerate(scripts[:5]):
        print(f'Script {i}: {len(s)} chars, starts: {s[:80].strip()}')
"
          echo "=== DONE ==="
