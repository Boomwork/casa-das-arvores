name: Scrape Airbnb reviews (shell only)

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Fetch and extract reviews
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sS -L -A "$UA" -H "Accept-Language: nl,en;q=0.9" -o page.html "https://www.airbnb.com/rooms/27625624"
          echo "Page size: $(wc -c < page.html) bytes"

          echo "=== REVIEW-RELATED KEYS ==="
          grep -oP '"[a-zA-Z]{1,20}[Rr]eview[a-zA-Z]{0,20}":' page.html | sort -u | head -30

          echo "=== ALL LOCALIZED STRINGS ==="
          grep -oP '"localized[A-Za-z]+":"[^"]{3,50}"' page.html | sort -u | head -20

          echo "=== COMMENT/BODY KEYS ==="
          grep -oP '"(body|text|content|message|comment)[A-Za-z]*":"[^"]{20,200}"' page.html | head -10 | cut -c1-200

          echo "=== RATING VALUES ==="
          grep -oP '"(overallRating|starRating|guestRating|rating)":([0-9.]+)' page.html | sort -u | head -20

          echo "=== EXTRACT __NEXT_DATA__ SIZE AND KEYS ==="
          grep -oP '(?<=__NEXT_DATA__" type="application/json">)[^<]+' page.html | head -c 50000 | \
            jq -r 'paths | select(length == 1) | .[]' 2>/dev/null | head -30

          echo "=== TRY AIRBNB API REVIEWS ==="
          curl -sS -A "$UA" \
            -H "X-Airbnb-API-Key: d306zoyjsyarp7ifhu67rjxn52tv0t20" \
            -H "Content-Type: application/json" \
            "https://www.airbnb.com/api/v3/StaysPdpReviewsQuery?operationName=StaysPdpReviewsQuery&variables=%7B%22id%22%3A%2227625624%22%2C%22request%22%3A%7B%22fieldSelector%22%3A%22for_p3%22%2C%22limit%22%3A7%2C%22offset%22%3A0%7D%7D&extensions=%7B%7D" \
            | head -c 5000

          echo ""
          echo "=== DONE ==="
