name: Scrape Airbnb reviews

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and extract reviews
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sS -L -A "$UA" -H "Accept-Language: nl,en;q=0.9" -o page.html \
            "https://www.airbnb.com/rooms/27625624"
          echo "Size: $(wc -c < page.html) bytes"
          echo "=== REVIEWER NAMES ==="
          grep -oP '"reviewerName":"\K[^"]+' page.html | head -20
          echo "=== DATES ==="
          grep -oP '"localizedDate":"\K[^"]+' page.html | head -20
          echo "=== RATINGS ==="
          grep -oP '"rating":\K[0-9.]+' page.html | head -20
          echo "=== COMMENTS (first 300 chars each) ==="
          grep -oP '"comments":"\K[^"]{20,}' page.html | head -10 | cut -c1-300
          echo "=== DONE ==="
