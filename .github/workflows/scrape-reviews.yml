name: Scrape Airbnb reviews (temp)

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch listing and extract reviews
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

          echo "===== FETCHING LISTING PAGE ====="
          code=$(curl -sS -L -A "$UA" \
            -H "Accept-Language: nl,en;q=0.9" \
            -H "Accept: text/html,application/xhtml+xml" \
            -o page.html -w "%{http_code}" \
            "https://www.airbnb.com/rooms/27625624")
          echo "HTTP $code, bytes: $(wc -c < page.html)"

          echo "===== EXTRACT __NEXT_DATA__ ====="
          python3 -c "
import re, json, sys

html = open('page.html').read()

# Find __NEXT_DATA__ JSON
m = re.search(r'<script id=\"__NEXT_DATA__\" type=\"application/json\">(.*?)</script>', html, re.DOTALL)
if not m:
    print('No __NEXT_DATA__ found')
    sys.exit(0)

data = json.loads(m.group(1))

# Traverse to find reviews
def find_reviews(obj, depth=0):
    if depth > 20:
        return []
    if isinstance(obj, dict):
        # Look for review-like structures
        if 'localizedDate' in obj and 'comments' in obj:
            return [obj]
        results = []
        for v in obj.values():
            results.extend(find_reviews(v, depth+1))
        return results
    elif isinstance(obj, list):
        results = []
        for item in obj:
            results.extend(find_reviews(item, depth+1))
        return results
    return []

reviews = find_reviews(data)
print(f'Found {len(reviews)} review objects')
for i, r in enumerate(reviews[:10]):
    print(f'--- Review {i+1} ---')
    print(json.dumps({k: v for k, v in r.items() if k in [
        'comments', 'localizedDate', 'rating', 'reviewerName',
        'reviewer', 'id', 'createdAt', 'response', 'language'
    ]}, ensure_ascii=False, indent=2)[:500])
" 2>&1

          echo "===== TRY REVIEWS SECTION JSON ====="
          python3 -c "
import re, json, sys

html = open('page.html').read()

# Look for reviewsSection or similar
patterns = [
    r'\"reviews\":\s*(\[.*?\])',
    r'\"reviewDetails\":\s*(\{.*?\})',
    r'\"pdpReviews\".*?\"reviews\":\s*(\[.*?\])',
]
for p in patterns:
    m = re.search(p, html, re.DOTALL)
    if m:
        print(f'Pattern found: {p[:40]}')
        try:
            obj = json.loads(m.group(1)[:5000])
            print(json.dumps(obj, ensure_ascii=False, indent=2)[:2000])
        except Exception as e:
            print(f'Parse error: {e}')
            print(m.group(1)[:500])
        print('---')
        break
" 2>&1

          echo "===== SEARCH FOR REVIEWER NAMES IN HTML ====="
          grep -oE '"reviewerName":"[^"]{3,50}"' page.html | head -20
          grep -oE '"createdAt":"[^"]{10,30}"' page.html | head -20
          grep -oE '"localizedDate":"[^"]{5,30}"' page.html | head -20
          grep -oE '"comments":"[^"]{20,500}"' page.html | head -10 | cut -c1-200

          echo "===== DONE ====="
