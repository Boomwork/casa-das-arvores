name: Scrape Airbnb reviews (API v2)

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Try Airbnb reviews API
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

          echo "=== TRY V2 REVIEWS API ==="
          curl -sS -A "$UA" \
            -H "Accept: application/json" \
            -H "Accept-Language: nl,en;q=0.9" \
            -H "X-Airbnb-API-Key: d306zoyjsyarp7ifhu67rjxn52tv0t20" \
            "https://www.airbnb.com/api/v2/reviews?listing_id=27625624&sort_direction=DESC&page=1&count=7&_format=for_mobile_client" \
            | head -c 8000

          echo ""
          echo "=== TRY PAGINATED REVIEWS ==="
          curl -sS -A "$UA" \
            -H "Accept: application/json" \
            -H "X-Airbnb-API-Key: d306zoyjsyarp7ifhu67rjxn52tv0t20" \
            "https://www.airbnb.com/api/v2/homes_pdp_sections?listing_id=27625624&api_version=1.9.4&sections[]=REVIEWS" \
            | head -c 5000

          echo ""
          echo "=== TRY V3 GRAPHQL WITH CORRECT FORMAT ==="
          ID_B64=$(printf 'StayListing:27625624' | base64 -w 0)
          curl -sS -A "$UA" \
            -H "X-Airbnb-API-Key: d306zoyjsyarp7ifhu67rjxn52tv0t20" \
            -H "Content-Type: application/json" \
            -X POST \
            -d "{\"operationName\":\"StaysPdpSections\",\"variables\":{\"id\":\"$ID_B64\",\"pdpSectionsRequest\":{\"adults\":\"2\",\"layouts\":[\"SINGLE_COLUMN\"],\"sections\":[\"REVIEWS\"]}},\"extensions\":{}}" \
            "https://www.airbnb.com/api/v3/StaysPdpSections?operationName=StaysPdpSections" \
            | head -c 8000

          echo ""
          echo "=== DONE ==="
