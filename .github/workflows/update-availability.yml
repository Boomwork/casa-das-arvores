name: Update Airbnb availability

# Haalt de Airbnb-agenda server-side op (geen CORS) en schrijft calendar.ics
# naast de site, zodat de kalender op casadasarvores.com altijd snel en
# betrouwbaar laadt.

on:
  schedule:
    - cron: '17 */2 * * *'   # elke 2 uur
  workflow_dispatch:          # handmatig te starten via de Actions-tab

permissions:
  contents: write

concurrency:
  group: update-availability
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Airbnb iCal
        run: |
          set -e
          URL="https://www.airbnb.com/calendar/ical/27625624.ics?t=99e49cb78fc546b3974647ad8552c337"
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fsSL -A "Mozilla/5.0 (compatible; CasaDasArvoresBot/1.0)" "$URL" -o raw.ics; then
              if grep -q "BEGIN:VCALENDAR" raw.ics; then
                ok=1
                echo "Fetched valid iCal on attempt $i"
                break
              fi
            fi
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Could not fetch a valid iCal from Airbnb after 5 attempts"
            exit 1
          fi
          # Privacy: bewaar alleen de bezette datumranges. DESCRIPTION (reserverings-URL +
          # laatste 4 cijfers telefoon), UID en SUMMARY bevatten gastgegevens en worden
          # weggelaten — het bestand is openbaar. De frontend gebruikt enkel DTSTART/DTEND.
          awk '
            /^BEGIN:VCALENDAR/ {print; next}
            /^END:VCALENDAR/   {print; next}
            /^VERSION:/        {print; next}
            /^PRODID:/         {print; next}
            /^CALSCALE:/       {print; next}
            /^BEGIN:VEVENT/    {print; next}
            /^END:VEVENT/      {print; next}
            /^DTSTART/         {print; next}
            /^DTEND/           {print; next}
          ' raw.ics > calendar.ics
          rm -f raw.ics

      - name: Commit if changed
        run: |
          git add calendar.ics
          if git diff --cached --quiet; then
            echo "Geen wijzigingen in de agenda."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Airbnb availability calendar"
          git push
